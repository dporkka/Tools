name: Reusable Python CI

on:
  workflow_call:
    inputs:
      runner_json:
        description: JSON runner selector, e.g. `"ubuntu-latest"` or `["self-hosted","Linux","X64"]`
        required: false
        type: string
        default: '"ubuntu-latest"'
      python_version:
        required: false
        type: string
        default: '3.13'
      working_directory:
        required: false
        type: string
        default: .
      timeout_minutes:
        required: false
        type: number
        default: 25
      pre_command:
        required: false
        type: string
        default: ""
      install_command:
        required: false
        type: string
        default: ""
      lint_command:
        required: false
        type: string
        default: ""
      test_command:
        required: false
        type: string
        default: pytest -q

permissions:
  contents: read

jobs:
  python:
    runs-on: ${{ fromJSON(inputs.runner_json) }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python_version }}

      - name: Caller setup
        if: ${{ inputs.pre_command != '' }}
        shell: bash
        run: ${{ inputs.pre_command }}

      - name: Install dependencies
        if: ${{ inputs.install_command != '' }}
        shell: bash
        run: ${{ inputs.install_command }}

      - name: Lint
        if: ${{ inputs.lint_command != '' }}
        shell: bash
        run: ${{ inputs.lint_command }}

      - name: Test
        if: ${{ inputs.test_command != '' }}
        shell: bash
        run: ${{ inputs.test_command }}
